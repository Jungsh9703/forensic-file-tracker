name = "forensic-file-tracker"
main = "src/index.ts"
compatibility_date = "2025-04-01"
# Needed for `node:zlib` (gunzip/inflate/brotli) in src/decode.ts, used to
# decompress forensic copy Payloads whose Headers carry Content-Encoding.
compatibility_flags = ["nodejs_compat"]

# Cloudflare only: Logpush -> R2 -> Workers (step 1), + D1 (step 2) and a
# Worker-served dashboard (step 3). See docs/forensic-file-tracking.md.

# --- R2 bucket that receives BOTH Logpush jobs, under separate prefixes ---
#   1. dataset "gateway_http"        -> prefix HTTP_LOG_PREFIX     ("http/")
#   2. dataset "DLP forensic copies" -> prefix FORENSIC_LOG_PREFIX ("forensic/")
[[r2_buckets]]
binding = "LOGS_BUCKET"
bucket_name = "sh-logpush-test"

[vars]
HTTP_LOG_PREFIX = "http/"
FORENSIC_LOG_PREFIX = "forensic/"

# Cap on R2 objects scanned per prefix for one GET /forensic/lookup call
# (src/lookup.ts). Lookups scan R2 directly by date until step 2 (D1) lands,
# so this bounds a single request's wall time on busy days.
MAX_LOOKUP_OBJECTS = "200"

# --- Secrets (do NOT put these in this file) ---
# wrangler secret put LOOKUP_TOKEN   # Bearer token for /forensic/lookup + /forensic/file -- returns real uploaded file contents, so those endpoints refuse to run without it
